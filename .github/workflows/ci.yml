name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Check changed content for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$EVENT_BEFORE" =~ ^0+$ ]]; then
            git diff-tree --check --root -r HEAD
          else
            git diff --check "$EVENT_BEFORE..HEAD"
          fi

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify built wheel and console command
        run: |
          wheel_venv="$RUNNER_TEMP/wheel-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install dist/*.whl
          "$wheel_venv/bin/python" -c "import main; assert callable(main.main)"
          test -x "$wheel_venv/bin/expense-tracker"
          test -x "$wheel_venv/bin/expense-tracker-storage"
          "$wheel_venv/bin/expense-tracker-storage" --help
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          printf '0\n' | "$wheel_venv/bin/expense-tracker"
          test -f data/smart_expense_tracker.sqlite3
