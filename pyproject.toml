[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-expense-tracker"
version = "1.5.1"
description = "A command-line expense tracker with local JSON and SQLite storage."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "tomli>=2.0,<3.0; python_version < '3.11'",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[project.scripts]
expense-tracker = "main:main"
expense-tracker-storage = "sqlite_backup:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "account",
    "application",
    "account_repository",
    "account_service",
    "account_storage",
    "category",
    "category_repository",
    "category_service",
    "category_storage",
    "clock",
    "date_policy",
    "excel_exporter",
    "excel_import",
    "excel_import_service",
    "excel_template",
    "excel_workbook",
    "formatter",
    "id_generator",
    "json_storage",
    "main",
    "persistence_errors",
    "report",
    "search",
    "sqlite_account_repository",
    "sqlite_backup",
    "sqlite_category_repository",
    "sqlite_database",
    "sqlite_migration",
    "sqlite_schema",
    "sqlite_transaction_repository",
    "storage",
    "transaction",
    "transaction_factory",
    "transaction_repository",
    "transaction_service",
    "validators",
]
