[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-expense-tracker"
version = "1.4.0"
description = "A command-line application for tracking income and expenses in local JSON files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "pytest>=8.0,<9.0",
    "tomli>=2.0,<3.0; python_version < '3.11'",
]

[project.scripts]
expense-tracker = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "account",
    "application",
    "account_repository",
    "account_service",
    "account_storage",
    "category",
    "category_repository",
    "category_service",
    "category_storage",
    "clock",
    "date_policy",
    "excel_exporter",
    "excel_import",
    "excel_import_service",
    "excel_template",
    "excel_workbook",
    "formatter",
    "id_generator",
    "json_storage",
    "main",
    "persistence_errors",
    "report",
    "search",
    "sqlite_database",
    "sqlite_schema",
    "storage",
    "transaction",
    "transaction_factory",
    "transaction_repository",
    "transaction_service",
    "validators",
]
